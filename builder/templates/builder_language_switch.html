{% load i18n %}{% get_current_language as CURRENT_LANGUAGE %}{% get_available_languages as AVAILABLE_LANGUAGES %}
<form action="{% url 'set_language' %}" method="post" class="hm-language-switch">
	{% csrf_token %}
	<input name="next" type="hidden" value="{{ request.get_full_path }}">
	<select name="language" aria-label="{% trans 'Language' %}" onchange="this.form.submit()">
		{% for code, name in AVAILABLE_LANGUAGES %}
			<option value="{{ code }}"{% if code == CURRENT_LANGUAGE %} selected{% endif %}>{{ name }}</option>
		{% endfor %}
	</select>
</form>
