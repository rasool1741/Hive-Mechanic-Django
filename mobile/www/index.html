<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>بازی شهری</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0f172a; color:#e2e8f0; font-family:Vazirmatn, Tahoma, system-ui, sans-serif; }
  .box { width:min(420px, 92vw); text-align:center; }
  h1 { color:#f59e0b; }
  input { width:100%; box-sizing:border-box; font:inherit; padding:.7rem; border-radius:10px; border:1px solid #334155; background:#0b1222; color:#e2e8f0; direction:ltr; }
  button { width:100%; font:inherit; font-weight:700; padding:.8rem; margin-top:.75rem; border-radius:10px; border:0; background:#f59e0b; color:#111827; }
  button.secondary { background:#1e293b; color:#e2e8f0; border:1px solid #334155; }
  .muted { color:#94a3b8; }
  .error { color:#ef4444; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="box">
  <h1>بازی شهری</h1>
  <p id="status" class="muted">در حال اتصال…</p>
  <form id="setup" hidden>
    <p>نشانی سرور بازی را وارد کنید</p>
    <input id="server" type="url" inputmode="url" placeholder="https://play.example.com" autocomplete="url" required>
    <button type="submit">اتصال</button>
  </form>
  <div id="retry" hidden>
    <button id="again">دوباره</button>
    <button id="change" class="secondary">تغییر سرور</button>
  </div>
</div>
<script src="config.js"></script>
<script>
(function () {
  var KEY = 'player-server';
  var status = document.getElementById('status');
  var setup = document.getElementById('setup');
  var input = document.getElementById('server');
  var retry = document.getElementById('retry');

  function normalise(value) {
    value = (value || '').trim().replace(/\/+$/, '').replace(/\/play$/, '');
    if (value && !/^https?:\/\//i.test(value)) value = 'https://' + value;
    return value;
  }

  function ask(message) {
    status.textContent = message || '';
    status.className = message ? 'error' : 'muted';
    retry.hidden = true;
    setup.hidden = false;
    input.value = localStorage.getItem(KEY) || window.PLAYER_DEFAULT_SERVER || '';
    input.focus();
  }

  function open(server) {
    setup.hidden = true;
    retry.hidden = true;
    status.className = 'muted';
    status.textContent = 'در حال اتصال به ' + server + ' …';
    var done = false;
    var timer = setTimeout(function () { if (!done) fail(); }, 15000);
    function fail() {
      done = true;
      status.className = 'error';
      status.textContent = 'سرور در دسترس نیست. اینترنت را بررسی کنید.';
      retry.hidden = false;
    }
    fetch(server + '/play/manifest.webmanifest', { mode: 'no-cors', cache: 'no-store' }).then(function () {
      if (done) return;
      done = true;
      clearTimeout(timer);
      location.replace(server + '/play/');
    }).catch(function () { clearTimeout(timer); if (!done) fail(); });
  }

  setup.addEventListener('submit', function (event) {
    event.preventDefault();
    var server = normalise(input.value);
    if (!server) { ask('نشانی معتبر نیست.'); return; }
    localStorage.setItem(KEY, server);
    open(server);
  });
  document.getElementById('again').addEventListener('click', function () { open(normalise(localStorage.getItem(KEY) || window.PLAYER_DEFAULT_SERVER)); });
  document.getElementById('change').addEventListener('click', function () { ask(''); });

  var server = normalise(localStorage.getItem(KEY) || window.PLAYER_DEFAULT_SERVER);
  if (/[?&]setup=1/.test(location.search)) ask(''); else if (server) open(server); else ask('');
})();
</script>
</body>
</html>
