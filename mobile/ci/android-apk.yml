name: Android app (APK)

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor
        working-directory: mobile
        run: npm ci

      - name: Default game server
        working-directory: mobile
        env:
          PLAYER_SERVER_URL: ${{ vars.PLAYER_SERVER_URL }}
        run: |
          printf "window.PLAYER_DEFAULT_SERVER = '%s';\n" "${PLAYER_SERVER_URL}" > www/config.js

      - name: Build debug APK
        working-directory: mobile
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk urban-games-player.apk

      - uses: actions/upload-artifact@v4
        with:
          name: urban-games-player-apk
          path: urban-games-player.apk

      - name: Publish to the android-latest release
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest urban-games-player.apk \
            --prerelease --target "${GITHUB_SHA}" \
            --title "Android app (latest build)" \
            --notes "Debug-signed APK built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Install on Android, then enter the game server address on first launch."
